name: Generate Snake Animation and Stats

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-output
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: mehtaaarush
          # GITHUB_TOKEN only sees this repo, so the snake misses most activity.
          # SNAKE_TOKEN (a personal token) lets it read the full public calendar.
          github_token: ${{ secrets.SNAKE_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif
            dist/github-contribution-grid-snake-dark.gif?palette=github-dark

      - name: Generate contribution stats card
        run: python .github/scripts/stats.py mehtaaarush dist

      - name: Push outputs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
